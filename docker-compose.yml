# Self-host deployment: two services, one shared ./data volume.
#
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
#
# Then open http://<host>:3000 → /setup creates the owner account.
# Only the web app is published; the agent stays on the internal network
# (the web proxy is the sole bridge — same topology as local dev).
services:
  agent:
    build: ./apps/agent
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build: ./apps/web
    depends_on:
      - agent
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
