services:
  - type: web
    name: wheel-of-time
    runtime: node
    plan: starter
    region: oregon
    rootDir: apps/agent
    # Build only the agent on Render now that the frontend deploys separately
    # to Vercel. mastra build emits .mastra/output/index.mjs.
    buildCommand: npm ci && npm run build
    startCommand: cd .mastra/output && node index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MASTRA_STUDIO_PATH
        value: studio
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      # Cross-origin allowlist for the Vercel-hosted frontend. Production
      # domain + *.vercel.app for preview deploys. Tighten to a single domain
      # when leaving demo mode.
      - key: ALLOWED_ORIGINS
        sync: false
      # Supabase: Postgres connection string for Mastra's runtime tables and
      # our domain tables; service-role secret for the corpus + admin ops;
      # publishable key for verifying user JWTs via MastraAuthSupabase.
      - key: POSTGRES_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
