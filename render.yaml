services:
  - type: web
    name: wheel-of-time
    runtime: node
    plan: starter
    region: oregon
    # --include=dev on web's install: NODE_ENV=production (set below) makes
    # npm skip devDependencies, but the web build needs vite + typescript.
    # Targeted override here so the runtime env var still does its job.
    buildCommand: npm ci && npm --prefix web ci --include=dev && npm run build
    startCommand: cd .mastra/output && node index.mjs
    healthCheckPath: /health
    disk:
      name: wheel-of-time-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/wheel-of-time.db
      - key: DRAFTS_DIR
        value: /data/drafts
      - key: MASTRA_STUDIO_PATH
        value: studio
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: DEMO_PASSCODE
        sync: false
      # Reference corpus lives in Supabase. The agent server reads via the
      # service-role secret (full read/write, bypasses RLS — fine for now
      # since corpus tables have no public policies).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
